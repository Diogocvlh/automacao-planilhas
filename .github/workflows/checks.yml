name: Verificações offline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar configuração sem serviços externos
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxe dos coletores
        run: python -m compileall -q config.py rodar_tudo.py vibra.py ipiranga.py tests
